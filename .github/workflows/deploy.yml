name: Deploy static site to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Electron's toolchain (@electron/rebuild, node-abi) requires node>=22,
          # and Node 22 ships npm 10.9 which reads the lockfile-v3 format cleanly.
          node-version: 22
          cache: npm

      - run: npm install --no-audit --no-fund --omit=optional
        env:
          # Skip the Electron binary download: this workflow only builds the static
          # web export, never the desktop app, so the Electron runtime isn't needed
          # and fetching it from GitHub releases is a flaky failure point.
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      # The static export: `next build` writes the hostable site to ./out.
      - run: npm run build
        env:
          # Pages serves this project at /manifest-diary (the repo subpath).
          # Empty BASE_PATH is fine for a custom-domain / project root.
          BASE_PATH: /manifest-diary

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
